<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Library Abstract Art Generator</title>
    <style>
        :root {
            --bg-color: #0e141b;
            --panel-bg: #1b2838;
            --accent-color: #66c0f4;
            --text-color: #f3f3f3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Control Panel */
        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #acb2b8;
        }

        input, select, button {
            background: #101822;
            border: 1px solid #2a475e;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #2a475e;
        }

        /* Main Display Canvas Area */
        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #05080c;
            position: relative;
        }

        canvas {
            max-width: 95%;
            max-height: 95%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            background: #000;
        }

        #status {
            font-size: 0.8rem;
            color: #66c0f4;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Steam Art Generator</h1>
        
        <div class="control-group">
            <label for="style-select">Estilo Artístico:</label>
            <select id="style-select">
                <option value="mosaic">Mosaico Geométrico (Por Horas)</option>
                <option value="spiral">Espiral Logarítmica</option>
                <option value="chaos">Caos Poligonal Superpuesto</option>
            </select>
        </div>

        <div class="control-group">
            <label for="blend-select">Modo de Fusión (Blend):</label>
            <select id="blend-select">
                <option value="source-over">Normal</option>
                <option value="screen">Screen (Luminoso)</option>
                <option value="overlay">Overlay (Contraste)</option>
                <option value="difference">Difference (Inversión)</option>
                <option value="multiply">Multiply (Oscuro)</option>
            </select>
        </div>

        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <div class="control-group">
            <label for="steam-id">Steam ID64:</label>
            <input type="text" id="steam-id" placeholder="Ej: 76561198000000000">
        </div>

        <div class="control-group">
            <label for="api-key">Steam Web API Key:</label>
            <input type="password" id="api-key" placeholder="Tu clave de API de Steam">
        </div>

        <button id="btn-fetch">Cargar mi Librería</button>
        <button id="btn-demo" class="btn-secondary">Usar Modo Demo (Sin API)</button>
        <button id="btn-render" style="display:none; background: #5c7e10;">Regenerar Arte</button>
        
        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <button id="btn-download" class="btn-secondary">Guardar Arte (PNG)</button>

        <div id="status">Listo para crear.</div>
    </div>

    <div id="canvas-container">
        <canvas id="art-canvas" width="1200" height="1200"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let loadedGames = [];

        // Juegos de prueba para el Modo Demo
        const demoGames = [
            { appid: 570, name: "Dota 2", playtime_forever: 12000 },
            { appid: 730, name: "CS:GO", playtime_forever: 8500 },
            { appid: 1091500, name: "Cyberpunk 2077", playtime_forever: 4200 },
            { appid: 271590, name: "GTA V", playtime_forever: 3100 },
            { appid: 1172470, name: "Apex Legends", playtime_forever: 2500 },
            { appid: 413150, name: "Stardew Valley", playtime_forever: 1800 },
            { appid: 292030, name: "The Witcher 3", playtime_forever: 5400 },
            { appid: 1086000, name: "Baldur's Gate 3", playtime_forever: 6200 },
            { appid: 1145360, name: "Hades", playtime_forever: 1500 },
            { appid: 367520, name: "Hollow Knight", playtime_forever: 2100 },
            { appid: 1245620, name: "Elden Ring", playtime_forever: 7800 },
            { appid: 105600, name: "Terraria", playtime_forever: 3300 }
        ];

        // Cargar imágenes de la API CDN de Steam
        async function loadGameImages(games) {
            statusEl.textContent = "Cargando portadas de juegos...";
            const imagePromises = games.map(game => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    // URL pública directa de la cápsula del juego en Steam
                    img.src = `https://corsproxy.io/?https://cdn.cloudflare.steamstatic.com/steam/apps/${game.appid}/header.jpg`;
                    
                    img.onload = () => resolve({ ...game, img });
                    img.onerror = () => {
                        // Si falla la imagen principal, usamos un placeholder geométrico
                        resolve({ ...game, img: null });
                    };
                });
            });

            return Promise.all(imagePromises);
        }

        // Estilo 1: Mosaico Treemap
        function renderMosaic(games) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const totalPlaytime = games.reduce((acc, g) => acc + (g.playtime_forever || 10), 0);
            
            let x = 0, y = 0, width = canvas.width, height = canvas.height;

            games.forEach((game, index) => {
                const ratio = (game.playtime_forever || 10) / totalPlaytime;
                const area = canvas.width * canvas.height * ratio;
                
                let w = index % 2 === 0 ? Math.sqrt(area * 1.5) : area / height;
                let h = area / w;

                w = Math.min(Math.max(w, 80), canvas.width - x);
                h = Math.min(Math.max(h, 80), canvas.height - y);

                ctx.save();
                ctx.globalCompositeOperation = document.getElementById('blend-select').value;
                
                if (game.img) {
                    ctx.drawImage(game.img, x, y, w, h);
                } else {
                    ctx.fillStyle = `hsl(${(game.appid * 137) % 360}, 60%, 40%)`;
                    ctx.fillRect(x, y, w, h);
                }

                // Superposición abstracta
                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
                ctx.restore();

                x += w * 0.6;
                if (x >= canvas.width - 100) {
                    x = 0;
                    y += h * 0.6;
                }
                if (y >= canvas.height) y = 0;
            });
        }

        // Estilo 2: Espiral Logarítmica
        function renderSpiral(games) {
            ctx.fillStyle = "#05080c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            let angle = 0;
            let radius = 20;

            games.forEach((game, index) => {
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                const size = Math.max(60, Math.min(250, (game.playtime_forever / 50)));

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle + index);
                ctx.globalCompositeOperation = document.getElementById('blend-select').value;

                if (game.img) {
                    ctx.drawImage(game.img, -size / 2, -size / 2, size, size * 0.6);
                } else {
                    ctx.fillStyle = `hsl(${index * 30}, 70%, 50%)`;
                    ctx.fillRect(-size / 2, -size / 2, size, size);
                }

                ctx.restore();

                angle += 0.4;
                radius += 12;
            });
        }

        // Estilo 3: Caos Poligonal
        function renderChaos(games) {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            games.forEach((game, index) => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 300 + 100;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(Math.random() * Math.PI * 2);
                ctx.globalCompositeOperation = document.getElementById('blend-select').value;

                // Crear máscara triangular/poligonal
                ctx.beginPath();
                ctx.moveTo(0, -size / 2);
                ctx.lineTo(size / 2, size / 2);
                ctx.lineTo(-size / 2, size / 2);
                ctx.closePath();
                ctx.clip();

                if (game.img) {
                    ctx.drawImage(game.img, -size / 2, -size / 2, size, size);
                } else {
                    ctx.fillStyle = `hsl(${Math.random() * 360}, 80%, 50%)`;
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        // Controlador de renderizado
        function generateArt() {
            if (loadedGames.length === 0) return;

            const style = document.getElementById('style-select').value;
            statusEl.textContent = "Generando composición...";

            setTimeout(() => {
                if (style === 'mosaic') renderMosaic(loadedGames);
                else if (style === 'spiral') renderSpiral(loadedGames);
                else if (style === 'chaos') renderChaos(loadedGames);
                statusEl.textContent = "¡Obra de arte generada!";
            }, 50);
        }

        // Eventos de botones
        document.getElementById('btn-demo').addEventListener('click', async () => {
            loadedGames = await loadGameImages(demoGames);
            document.getElementById('btn-render').style.display = 'block';
            generateArt();
        });

        document.getElementById('btn-render').addEventListener('click', generateArt);

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            const steamId = document.getElementById('steam-id').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();

            if (!steamId || !apiKey) {
                alert("Por favor ingresa tu Steam ID64 y tu Web API Key.");
                return;
            }

            statusEl.textContent = "Obteniendo datos de Steam...";
            const endpoint = `https://corsproxy.io/?https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${apiKey}&steamid=${steamId}&format=json&include_appinfo=true`;

            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                
                if (data.response && data.response.games) {
                    // Ordenar por tiempo jugado de mayor a menor
                    const userGames = data.response.games.sort((a, b) => b.playtime_forever - a.playtime_forever);
                    loadedGames = await loadGameImages(userGames.slice(0, 30)); // Tomar los 30 más jugados
                    document.getElementById('btn-render').style.display = 'block';
                    generateArt();
                } else {
                    statusEl.textContent = "Error: Perfil privado o datos incorrectos.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error al conectar con la API de Steam.";
            }
        });

        // Descargar Canvas como imagen PNG
        document.getElementById('btn-download').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'steam-abstract-art.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
