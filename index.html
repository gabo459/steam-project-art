<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Library Poster Showcase</title>
    <style>
        :root {
            --bg-color: #0e141b;
            --panel-bg: #1b2838;
            --accent-color: #66c0f4;
            --text-color: #f3f3f3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #acb2b8;
        }

        input, select, button {
            background: #101822;
            border: 1px solid #2a475e;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 5px;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .btn-secondary { background: #2a475e; }

        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #05080c;
        }

        canvas {
            max-width: 95%;
            max-height: 95%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            background: #0e141b;
        }

        #status {
            font-size: 0.8rem;
            color: #66c0f4;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Steam Library Poster</h1>
        
        <div class="control-group">
            <label for="style-select">Diseño del Mural:</label>
            <select id="style-select">
                <option value="hero">Top 1 Destacado + Galería</option>
                <option value="grid">Mural de Colección (Grid)</option>
                <option value="proportional">Mosaico Simétrico por Horas</option>
            </select>
        </div>

        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <button id="btn-load-repo" style="background: #2e7d32;">Cargar desde GitHub (JSON)</button>

        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <div class="control-group">
            <label for="steam-id">Steam ID64:</label>
            <input type="text" id="steam-id" placeholder="Ej: 76561198000000000">
        </div>

        <div class="control-group">
            <label for="api-key">Steam Web API Key:</label>
            <input type="password" id="api-key" placeholder="Tu clave de API de Steam">
        </div>

        <button id="btn-fetch">Consultar API de Steam</button>
        <button id="btn-export-json" class="btn-secondary" style="display:none;">Guardar Librería a JSON</button>
        
        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <button id="btn-download" class="btn-secondary">Descargar Póster (PNG)</button>

        <div id="status">Iniciando...</div>
    </div>

    <div id="canvas-container">
        <canvas id="art-canvas" width="1200" height="1200"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let loadedGames = [];

        // Función con peticiones seguras a través de múltiples proxies CORS
        async function fetchWithFallback(targetUrl) {
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
            ];

            for (const proxyUrl of proxies) {
                try {
                    const response = await fetch(proxyUrl);
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.trim().length > 0) {
                            return text;
                        }
                    }
                } catch (e) {
                    console.warn(`Proxy falló: ${proxyUrl}. Intentando siguiente...`);
                }
            }
            throw new Error("No se pudo conectar a través de ningún servidor proxy.");
        }

        async function fetchImageBlob(appid) {
            const rawUrl = `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/header.jpg`;
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(rawUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rawUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`
            ];

            for (const proxyUrl of proxies) {
                try {
                    const response = await fetch(proxyUrl);
                    if (response.ok) {
                        const blob = await response.blob();
                        if (blob.type.startsWith('image/')) {
                            return URL.createObjectURL(blob);
                        }
                    }
                } catch (err) {
                    // Siguiente proxy
                }
            }
            return null;
        }

        function imageToBase64(img) {
            if (!img) return null;
            try {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = img.naturalWidth || img.width || 460;
                tempCanvas.height = img.naturalHeight || img.height || 215;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(img, 0, 0);
                return tempCanvas.toDataURL('image/jpeg', 0.85);
            } catch (e) {
                return null;
            }
        }

        async function loadGameImages(games) {
            statusEl.textContent = "Cargando portadas...";
            
            const imagePromises = games.map(async (game) => {
                if (game.imageBase64) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => resolve({ ...game, img });
                        img.onerror = () => resolve({ ...game, img: null });
                        img.src = game.imageBase64;
                    });
                }

                const blobUrl = await fetchImageBlob(game.appid);
                if (blobUrl) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => resolve({ ...game, img });
                        img.onerror = () => resolve({ ...game, img: null });
                        img.src = blobUrl;
                    });
                }

                return { ...game, img: null };
            });

            return Promise.all(imagePromises);
        }

        function drawCard(game, x, y, w, h) {
            if (game.img) {
                ctx.drawImage(game.img, x, y, w, h);
            } else {
                ctx.fillStyle = "#1b2838";
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = "#66c0f4";
                ctx.font = "bold 13px Segoe UI, sans-serif";
                ctx.fillText(game.name || `App ${game.appid}`, x + 10, y + h / 2);
            }
            ctx.strokeStyle = "#2a475e";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
        }

        function renderGrid(games) {
            ctx.fillStyle = "#0e141b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cols = 4;
            const padding = 40;
            const gap = 20;

            const itemWidth = (canvas.width - (padding * 2) - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * 0.46;

            games.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + col * (itemWidth + gap);
                const y = padding + row * (itemHeight + gap);

                if (y + itemHeight > canvas.height - padding) return;
                drawCard(game, x, y, itemWidth, itemHeight);
            });
        }

        function renderHero(games) {
            ctx.fillStyle = "#0a0f14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (games.length === 0) return;

            const padding = 40;
            const gap = 15;

            const topGame = games[0];
            const heroWidth = canvas.width - (padding * 2);
            const heroHeight = heroWidth * 0.45;

            drawCard(topGame, padding, padding, heroWidth, heroHeight);

            const subGames = games.slice(1);
            const cols = 4;
            const startY = padding + heroHeight + 30;

            const itemWidth = (canvas.width - (padding * 2) - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * 0.46;

            subGames.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + col * (itemWidth + gap);
                const y = startY + row * (itemHeight + gap);

                if (y + itemHeight > canvas.height - padding) return;
                drawCard(game, x, y, itemWidth, itemHeight);
            });
        }

        function renderProportional(games) {
            ctx.fillStyle = "#0e141b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const total = games.reduce((acc, g) => acc + (g.playtime_forever || 10), 0);
            let x = 30, y = 30;
            const maxWidth = canvas.width - 60;

            games.forEach((game) => {
                const ratio = (game.playtime_forever || 10) / total;
                const w = Math.max(140, Math.min(maxWidth, Math.sqrt(maxWidth * canvas.height * ratio * 1.5)));
                const h = w * 0.46;

                if (x + w > canvas.width - 30) {
                    x = 30;
                    y += h + 15;
                }

                if (y + h > canvas.height - 30) return;

                drawCard(game, x, y, w, h);
                x += w + 15;
            });
        }

        function generateArt() {
            if (loadedGames.length === 0) return;

            const style = document.getElementById('style-select').value;
            statusEl.textContent = "Dibujando póster...";

            setTimeout(() => {
                if (style === 'grid') renderGrid(loadedGames);
                else if (style === 'hero') renderHero(loadedGames);
                else if (style === 'proportional') renderProportional(loadedGames);
                statusEl.textContent = "¡Póster renderizado con éxito!";
            }, 50);
        }

        async function fetchRepoJSON() {
            statusEl.textContent = "Buscando steam_games.json...";
            try {
                const response = await fetch('./steam_games.json');
                if (response.ok) {
                    const rawText = await response.text();
                    const gamesData = JSON.parse(rawText);
                    loadedGames = await loadGameImages(gamesData);
                    generateArt();
                } else {
                    statusEl.textContent = "No se encontró steam_games.json en el repositorio.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error al leer steam_games.json local.";
            }
        }

        window.addEventListener('DOMContentLoaded', fetchRepoJSON);

        document.getElementById('btn-load-repo').addEventListener('click', fetchRepoJSON);
        document.getElementById('style-select').addEventListener('change', generateArt);

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            const steamId = document.getElementById('steam-id').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();

            if (!steamId || !apiKey) {
                alert("Por favor ingresa tu Steam ID64 y tu Web API Key.");
                return;
            }

            statusEl.textContent = "Consultando API de Steam mediante proxies...";
            const targetUrl = `https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${apiKey}&steamid=${steamId}&format=json&include_appinfo=true`;

            try {
                const rawResponse = await fetchWithFallback(targetUrl);
                const data = JSON.parse(rawResponse);
                
                if (data.response && data.response.games) {
                    const userGames = data.response.games.sort((a, b) => b.playtime_forever - a.playtime_forever);
                    loadedGames = await loadGameImages(userGames.slice(0, 24));
                    document.getElementById('btn-export-json').style.display = 'block';
                    generateArt();
                } else {
                    statusEl.textContent = "Error: Perfil privado o credenciales incorrectas.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error de red: Los proxies fallaron en conectar con Steam.";
            }
        });

        document.getElementById('btn-export-json').addEventListener('click', () => {
            if (loadedGames.length === 0) return;

            statusEl.textContent = "Generando JSON listo para GitHub...";
            const cacheData = loadedGames.map(game => ({
                appid: game.appid,
                name: game.name,
                playtime_forever: game.playtime_forever,
                imageBase64: imageToBase64(game.img)
            }));

            const blob = new Blob([JSON.stringify(cacheData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'steam_games.json';
            a.click();
            URL.revokeObjectURL(url);
            statusEl.textContent = "JSON descargado. Reemplázalo en tu repositorio.";
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'steam-library-poster.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
