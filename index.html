<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Library Poster Showcase</title>
    <style>
        :root {
            --bg-color: #0e141b;
            --panel-bg: #1b2838;
            --accent-color: #66c0f4;
            --text-color: #f3f3f3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #acb2b8;
        }

        input, select, button {
            background: #101822;
            border: 1px solid #2a475e;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 5px;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .btn-secondary { background: #2a475e; }

        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #05080c;
        }

        canvas {
            max-width: 95%;
            max-height: 95%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            background: #0e141b;
        }

        #status {
            font-size: 0.8rem;
            color: #66c0f4;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Steam Library Poster</h1>
        
        <div class="control-group">
            <label for="style-select">Diseño del Mural:</label>
            <select id="style-select">
                <option value="grid">Mural de Colección (Grid)</option>
                <option value="hero">Top 1 Destacado + Galería</option>
                <option value="proportional">Mosaico Simétrico por Horas</option>
            </select>
        </div>

        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <div class="control-group">
            <label for="steam-id">Steam ID64:</label>
            <input type="text" id="steam-id" placeholder="Ej: 76561198000000000">
        </div>

        <div class="control-group">
            <label for="api-key">Steam Web API Key:</label>
            <input type="password" id="api-key" placeholder="Tu clave de API de Steam">
        </div>

        <button id="btn-fetch">Cargar mi Librería</button>
        <button id="btn-demo" class="btn-secondary">Usar Modo Demo (Sin API)</button>
        <button id="btn-render" style="display:none; background: #5c7e10;">Cambiar Vista</button>
        
        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <button id="btn-download" class="btn-secondary">Descargar Póster (PNG)</button>

        <div id="status">Listo para crear.</div>
    </div>

    <div id="canvas-container">
        <canvas id="art-canvas" width="1200" height="1200"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let loadedGames = [];

        const demoGames = [
            { appid: 570, name: "Dota 2", playtime_forever: 12000 },
            { appid: 730, name: "CS:GO", playtime_forever: 8500 },
            { appid: 1091500, name: "Cyberpunk 2077", playtime_forever: 4200 },
            { appid: 271590, name: "GTA V", playtime_forever: 3100 },
            { appid: 1172470, name: "Apex Legends", playtime_forever: 2500 },
            { appid: 413150, name: "Stardew Valley", playtime_forever: 1800 },
            { appid: 292030, name: "The Witcher 3", playtime_forever: 5400 },
            { appid: 1086000, name: "Baldur's Gate 3", playtime_forever: 6200 },
            { appid: 1145360, name: "Hades", playtime_forever: 1500 },
            { appid: 367520, name: "Hollow Knight", playtime_forever: 2100 },
            { appid: 1245620, name: "Elden Ring", playtime_forever: 7800 },
            { appid: 105600, name: "Terraria", playtime_forever: 3300 }
        ];

        // Carga de imágenes optimizada con enlace directo a CDN sin bloqueos CORS
        async function loadGameImages(games) {
            statusEl.textContent = "Cargando portadas de juegos...";
            const imagePromises = games.map(game => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    
                    // URL directa de Cloudflare/Akamai CDN de Steam
                    img.src = `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${game.appid}/header.jpg`;

                    img.onload = () => resolve({ ...game, img });
                    img.onerror = () => {
                        // Respaldo de URL secundaria si la principal falla
                        const imgFallback = new Image();
                        imgFallback.crossOrigin = "anonymous";
                        imgFallback.src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${game.appid}/header.jpg`;
                        imgFallback.onload = () => resolve({ ...game, img: imgFallback });
                        imgFallback.onerror = () => resolve({ ...game, img: null });
                    };
                });
            });

            return Promise.all(imagePromises);
        }

        function drawCard(game, x, y, w, h) {
            if (game.img) {
                ctx.drawImage(game.img, x, y, w, h);
            } else {
                // Fondo de tarjeta de respaldo si no hay portada disponible
                ctx.fillStyle = "#1b2838";
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = "#66c0f4";
                ctx.font = "bold 13px Segoe UI, sans-serif";
                ctx.fillText(game.name || `App ${game.appid}`, x + 10, y + h / 2);
            }
            ctx.strokeStyle = "#2a475e";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
        }

        // Estilo 1: Grid Limpio
        function renderGrid(games) {
            ctx.fillStyle = "#0e141b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cols = 4;
            const padding = 40;
            const gap = 20;

            const itemWidth = (canvas.width - (padding * 2) - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * 0.46;

            games.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + col * (itemWidth + gap);
                const y = padding + row * (itemHeight + gap);

                if (y + itemHeight > canvas.height - padding) return;
                drawCard(game, x, y, itemWidth, itemHeight);
            });
        }

        // Estilo 2: Top 1 Destacado + Galería
        function renderHero(games) {
            ctx.fillStyle = "#0a0f14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (games.length === 0) return;

            const padding = 40;
            const gap = 15;

            const topGame = games[0];
            const heroWidth = canvas.width - (padding * 2);
            const heroHeight = heroWidth * 0.45;

            drawCard(topGame, padding, padding, heroWidth, heroHeight);

            const subGames = games.slice(1);
            const cols = 4;
            const startY = padding + heroHeight + 30;

            const itemWidth = (canvas.width - (padding * 2) - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * 0.46;

            subGames.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + col * (itemWidth + gap);
                const y = startY + row * (itemHeight + gap);

                if (y + itemHeight > canvas.height - padding) return;
                drawCard(game, x, y, itemWidth, itemHeight);
            });
        }

        // Estilo 3: Mosaico Proporcional
        function renderProportional(games) {
            ctx.fillStyle = "#0e141b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const total = games.reduce((acc, g) => acc + (g.playtime_forever || 10), 0);
            let x = 30, y = 30;
            const maxWidth = canvas.width - 60;

            games.forEach((game) => {
                const ratio = (game.playtime_forever || 10) / total;
                const w = Math.max(140, Math.min(maxWidth, Math.sqrt(maxWidth * canvas.height * ratio * 1.5)));
                const h = w * 0.46;

                if (x + w > canvas.width - 30) {
                    x = 30;
                    y += h + 15;
                }

                if (y + h > canvas.height - 30) return;

                drawCard(game, x, y, w, h);
                x += w + 15;
            });
        }

        function generateArt() {
            if (loadedGames.length === 0) return;

            const style = document.getElementById('style-select').value;
            statusEl.textContent = "Generando diseño...";

            setTimeout(() => {
                if (style === 'grid') renderGrid(loadedGames);
                else if (style === 'hero') renderHero(loadedGames);
                else if (style === 'proportional') renderProportional(loadedGames);
                statusEl.textContent = "¡Póster generado con éxito!";
            }, 50);
        }

        document.getElementById('btn-demo').addEventListener('click', async () => {
            loadedGames = await loadGameImages(demoGames);
            document.getElementById('btn-render').style.display = 'block';
            generateArt();
        });

        document.getElementById('btn-render').addEventListener('click', generateArt);

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            const steamId = document.getElementById('steam-id').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();

            if (!steamId || !apiKey) {
                alert("Por favor ingresa tu Steam ID64 y tu Web API Key.");
                return;
            }

            statusEl.textContent = "Obteniendo datos de Steam...";
            
            // Petición directa a la API de Steam
            const endpoint = `https://corsproxy.io/?https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${apiKey}&steamid=${steamId}&format=json&include_appinfo=true`;

            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                
                if (data.response && data.response.games) {
                    const userGames = data.response.games.sort((a, b) => b.playtime_forever - a.playtime_forever);
                    loadedGames = await loadGameImages(userGames.slice(0, 24));
                    document.getElementById('btn-render').style.display = 'block';
                    generateArt();
                } else {
                    statusEl.textContent = "Error: Perfil privado o datos incorrectos.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error al conectar con la API de Steam.";
            }
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'steam-library-poster.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
