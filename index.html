<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameDex – Buscador con Cloudflare KV Cache</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0F172A;
            --card-bg: #1E293B;
            --accent-purple: #8B5CF6;
            --accent-green: #10B981;
            --accent-cyan: #06B6D4;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* SEARCH FORM */
        .search-box {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            background-color: var(--card-bg);
            padding: 0.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 0.8rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
        }

        .search-box button {
            background: linear-gradient(135deg, var(--accent-purple), #7C3AED);
            color: white;
            border: none;
            padding: 0.8rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-box button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* RESULT CARD */
        .game-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: none;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-banner {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #000;
        }

        .card-body {
            padding: 2rem;
        }

        .badge-source {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-cache {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-api {
            background-color: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .game-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .meta-item span {
            color: var(--text-main);
            font-weight: 600;
        }

        .genres {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background-color: var(--bg-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        /* STATUS MESSAGES */
        .status-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>GameDex Cache Engine</h1>
            <p>Buscador inteligente impulsado por Cloudflare Workers & KV</p>
        </header>

        <!-- FORMULARIO DE BÚSQUEDA -->
        <form class="search-box" id="searchForm">
            <input type="text" id="searchInput" placeholder="Escribe el nombre de un juego (ej: Zelda, Witcher, Halo)..." required>
            <button type="submit">Buscar</button>
        </form>

        <!-- MENSAJE DE CARGA / ERROR -->
        <div id="statusMsg" class="status-msg">
            <div class="spinner" id="loadingSpinner"></div>
            <p id="statusText">Buscando en la base de datos local...</p>
        </div>

        <!-- TARJETA DEL JUEGO -->
        <article class="game-card" id="gameCard">
            <img id="gameImg" class="card-banner" src="" alt="Banner del juego">
            <div class="card-body">
                <div id="sourceBadge" class="badge-source"></div>
                <h2 id="gameTitle" class="game-title"></h2>
                <div class="game-meta">
                    <div class="meta-item">Lanzamiento: <span id="gameRelease"></span></div>
                    <div class="meta-item">Calificación: <span id="gameRating"></span> ⭐</div>
                </div>
                <div class="genres" id="gameGenres"></div>
            </div>
        </article>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL CON LA URL OFICIAL DE TU CLOUDFLARE WORKER
        const WORKER_URL = "https://api-juegos.TU-SUBDOMINIO.workers.dev";

        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const card = document.getElementById('gameCard');
        const statusMsg = document.getElementById('statusMsg');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('loadingSpinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            // Mostrar estado de carga
            card.style.display = 'none';
            statusMsg.style.display = 'block';
            spinner.style.display = 'block';
            statusText.textContent = `Consultando base de datos para "${query}"...`;

            try {
                const response = await fetch(`${WORKER_URL}?juego=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Juego no encontrado.');
                }

                // Identificar el origen del caché a través de los headers devueltos por el Worker
                const sourceHeader = response.headers.get('X-Source');
                mostrarJuego(data, sourceHeader);

            } catch (err) {
                spinner.style.display = 'none';
                statusText.textContent = `❌ ${err.message}`;
            }
        });

        function mostrarJuego(juego, fuente) {
            statusMsg.style.display = 'none';

            // Renderizar Banner e Información
            document.getElementById('gameImg').src = juego.imagen || 'https://via.placeholder.com/800x400?text=Sin+Imagen';
            document.getElementById('gameTitle').textContent = juego.nombre;
            document.getElementById('gameRelease').textContent = juego.lanzamiento || 'N/A';
            document.getElementById('gameRating').textContent = juego.rating || 'N/A';

            // Renderizar Géneros
            const genresContainer = document.getElementById('gameGenres');
            genresContainer.innerHTML = '';
            if (juego.generos && juego.generos.length > 0) {
                juego.generos.forEach(g => {
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.textContent = g;
                    genresContainer.appendChild(tag);
                });
            }

            // Renderizar Badge de Origen de Datos (Caché KV vs API Externa)
            const badge = document.getElementById('sourceBadge');
            if (fuente === 'KV-Cache') {
                badge.className = 'badge-source badge-cache';
                badge.innerHTML = '⚡ Servido desde Cloudflare KV (Caché Local)';
            } else {
                badge.className = 'badge-source badge-api';
                badge.innerHTML = '🌐 Obtenido de API Externa (Guardado en KV)';
            }

            card.style.display = 'block';
        }
    </script>
</body>
</html>
