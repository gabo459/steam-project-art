<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Library Poster Showcase</title>

    <link rel="preconnect" href="https://wsrv.nl" crossorigin>
    <link rel="preconnect" href="https://corsproxy.io" crossorigin>
    <link rel="preconnect" href="https://shared.cloudflare.steamstatic.com" crossorigin>
    <link rel="preconnect" href="https://steamproxy.ernestoygabo.workers.dev" crossorigin>

    <style>
        :root {
            --bg-color: #0e141b;
            --panel-bg: #1b2838;
            --accent-color: #66c0f4;
            --accent-green: #10b981;
            --text-color: #f3f3f3;
            --border-color: #2a475e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #acb2b8;
        }

        input, select, button {
            background: #101822;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .btn-secondary { background: var(--border-color); }

        .notice-box {
            background-color: rgba(102, 192, 244, 0.08);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #acb2b8;
            line-height: 1.4;
        }

        .notice-box strong { color: var(--accent-color); }

        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #05080c;
            overflow: auto;
        }

        canvas {
            max-width: 95%;
            max-height: 95%;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            border-radius: 6px;
            background: #0e141b;
        }

        #status {
            font-size: 0.8rem;
            color: var(--accent-color);
            min-height: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Steam Library Poster</h1>
        
        <div class="control-group">
            <label for="orientation-select">Orientación de Portadas:</label>
            <select id="orientation-select">
                <option value="vertical" selected>Vertical (Biblioteca Grid)</option>
                <option value="horizontal">Horizontal (Cabecera Clásica)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="style-select">Diseño del Mural:</label>
            <select id="style-select">
                <option value="proportional">Escala Logarítmica Suave (Recomendado)</option>
                <option value="hero">Top 1 Destacado + Galería</option>
                <option value="grid">Mural Uniforme (Grid)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="limit-select">Cantidad de Juegos:</label>
            <select id="limit-select">
                <option value="25" selected>Top 25 más jugados</option>
                <option value="20">Top 20 más jugados</option>
                <option value="15">Top 15 más jugados</option>
                <option value="10">Top 10 más jugados</option>
                <option value="5">Top 5 más jugados</option>
                <option value="50">Top 50 más jugados</option>
                <option value="100">Top 100 más jugados</option>
                <option value="250">Top 250 más jugados</option>
                <option value="500">Top 500 más jugados</option>
                <option value="all">Todos los jugados (>0h)</option>
            </select>
        </div>

        <hr style="border: 0.5px solid var(--border-color); width: 100%;">

        <div class="notice-box">
            <strong>Requisito de Privacidad:</strong> El perfil de Steam y <em>"Detalles de los juegos"</em> deben ser <strong>Públicos</strong>.
        </div>

        <div class="control-group">
            <label for="steam-input">Perfil o URL de Steam:</label>
            <input type="text" id="steam-input" placeholder="Ej: https://steamcommunity.com/id/usuario">
        </div>

        <button id="btn-fetch">Generar Póster</button>
        <button id="btn-download" class="btn-secondary">Descargar Póster (PNG)</button>

        <div id="status">Ingresa un perfil para comenzar.</div>
    </div>

    <div id="canvas-container">
        <canvas id="art-canvas" width="1200" height="1200"></canvas>
    </div>

    <script>
        const WORKER_URL = "https://steamproxy.ernestoygabo.workers.dev/";

        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let rawUserGames = [];
        let loadedGames = [];
        let userProfile = null;

        function getAspectRatio() {
            const orientation = document.getElementById('orientation-select').value;
            return orientation === 'horizontal' ? 0.467 : 1.5;
        }

        function parseSteamName(input) {
            if (!input) return "Usuario de Steam";
            if (input.includes("steamcommunity.com")) {
                const parts = input.replace(/\/$/, "").split("/");
                return parts[parts.length - 1] || "Usuario de Steam";
            }
            return input;
        }

        async function getSteamProfileInfo(userInput, workerData) {
            let name = parseSteamName(userInput);
            let avatarUrl = null;

            if (workerData.player && (workerData.player.avatarfull || workerData.player.avatar)) {
                return {
                    name: workerData.player.personaname || name,
                    avatarUrl: workerData.player.avatarfull || workerData.player.avatar
                };
            }

            let steamUrl = userInput.trim();
            if (!steamUrl.startsWith('http')) {
                steamUrl = /^\d{17}$/.test(userInput)
                    ? `https://steamcommunity.com/profiles/${userInput}`
                    : `https://steamcommunity.com/id/${userInput}`;
            }
            const xmlUrl = steamUrl.replace(/\/$/, "") + "/?xml=1";

            const proxyGenerators = [
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (const getProxyUrl of proxyGenerators) {
                try {
                    const res = await fetch(getProxyUrl(xmlUrl));
                    if (!res.ok) continue;
                    const text = await res.text();

                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(text, "text/xml");

                    const avatarNode = xmlDoc.querySelector("avatarFull") || xmlDoc.querySelector("avatarIcon") || xmlDoc.querySelector("avatarMedium");
                    const nameNode = xmlDoc.querySelector("steamID");

                    if (avatarNode && avatarNode.textContent) {
                        avatarUrl = avatarNode.textContent.trim();
                    }
                    if (nameNode && nameNode.textContent) {
                        name = nameNode.textContent.trim();
                    }

                    if (avatarUrl) break;
                } catch (e) {
                    console.warn("Fallo un proxy obteniendo el XML del perfil:", e);
                }
            }

            return { name, avatarUrl };
        }

        async function fetchGameImageWithFallback(game, orientation) {
        const appid = game.appid;
        const cacheKey = `steam_poster_img_${appid}_${orientation}`;
        const TTL_MS = 7 * 24 * 60 * 60 * 1000; // Tiempo de vida: 7 días en milisegundos
    
        // 1. REVISAR SI LA ENTRADA EN CACHÉ SIGUE VÍGENTE
        const cachedRaw = localStorage.getItem(cacheKey);
        if (cachedRaw) {
            try {
                const cached = JSON.parse(cachedRaw);
                const isExpired = (Date.now() - cached.timestamp) > TTL_MS;
    
                if (!isExpired && cached.url) {
                    const img = await new Promise((resolve, reject) => {
                        const i = new Image();
                        i.crossOrigin = "anonymous";
                        i.onload = () => resolve(i);
                        i.onerror = () => reject();
                        i.src = cached.url;
                    });
                    if (img && img.naturalWidth > 0) return img;
                } else {
                    localStorage.removeItem(cacheKey); // Registro expirado
                }
            } catch (e) {
                localStorage.removeItem(cacheKey); // Limpiar si había formato plano antiguo
            }
        }
    
        let steamSources = [];
    
        // 2. Portadas oficiales de la tienda de Steam
        if (orientation === 'horizontal') {
            steamSources.push(`https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/header.jpg`);
            steamSources.push(`https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/capsule_616x353.jpg`);
            steamSources.push(`https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/library_600x900.jpg`);
        } else {
            steamSources.push(`https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/library_600x900.jpg`);
            steamSources.push(`https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/header.jpg`);
            steamSources.push(`https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/capsule_616x353.jpg`);
        }
    
        // Probar las fuentes de Steam
        for (const rawUrl of steamSources) {
            const proxyUrl = `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}&output=webp&q=75`;
            try {
                const img = await new Promise((resolve, reject) => {
                    const i = new Image();
                    i.crossOrigin = "anonymous";
                    i.onload = () => resolve(i);
                    i.onerror = () => reject();
                    i.src = proxyUrl;
                });
                if (img && img.naturalWidth > 0) {
                    saveToCache(cacheKey, proxyUrl);
                    return img;
                }
            } catch (e) {}
        }
    
        // 3. RESPALDO EN STEAMGRIDDB (vía Worker)
        try {
            const sgdbRes = await fetch(`${WORKER_URL}?sgdb_appid=${appid}&orientation=${orientation}`);
            if (sgdbRes.ok) {
                const sgdbData = await sgdbRes.json();
                if (sgdbData.url) {
                    const proxyUrl = `https://wsrv.nl/?url=${encodeURIComponent(sgdbData.url)}&output=webp&q=75`;
                    const img = await new Promise((resolve, reject) => {
                        const i = new Image();
                        i.crossOrigin = "anonymous";
                        i.onload = () => resolve(i);
                        i.onerror = () => reject();
                        i.src = proxyUrl;
                    });
                    if (img && img.naturalWidth > 0) {
                        saveToCache(cacheKey, proxyUrl);
                        return img;
                    }
                }
            }
        } catch (e) {
            console.warn(`No se pudo obtener portada de SteamGridDB para AppID ${appid}:`, e);
        }
    
        return null;
    }
    
    // Función auxiliar para empaquetar la URL con la marca de tiempo
    function saveToCache(key, url) {
        try {
            const cacheData = {
                url: url,
                timestamp: Date.now()
            };
            localStorage.setItem(key, JSON.stringify(cacheData));
        } catch (e) {
            console.warn("No se pudo guardar en localStorage (espacio insuficiente).", e);
        }
    }
    
    async function loadGameImages(games) {
        const BATCH_SIZE = 30;
        const results = [];
        const orientation = document.getElementById('orientation-select').value;
    
        for (let i = 0; i < games.length; i += BATCH_SIZE) {
            const batch = games.slice(i, i + BATCH_SIZE);
            statusEl.textContent = `Descargando imágenes (${Math.min(i + BATCH_SIZE, games.length)} de ${games.length})...`;
            
            const batchPromises = batch.map(async (game) => {
                // Se pasa todo el objeto 'game' en lugar de solo 'game.appid'
                const img = await fetchGameImageWithFallback(game, orientation);
                return { ...game, img };
            });
    
            const batchResults = await Promise.all(batchPromises);
            results.push(...batchResults);
        }
    
        return results;
    }

        function formatPlaytime(minutes) {
            if (!minutes || minutes <= 0) return '0 hrs';
            const hours = Math.round(minutes / 60);
            return hours >= 1000 ? (hours / 1000).toFixed(1) + 'k hrs' : hours.toLocaleString() + ' hrs';
        }

        function getOptimalWidth(count) {
            const orientation = document.getElementById('orientation-select').value;
            const factor = orientation === 'horizontal' ? 1.3 : 1.0;

            if (count <= 10) return 1000 * factor;
            if (count <= 25) return 1200 * factor;
            if (count <= 50) return 1500 * factor;
            if (count <= 100) return 1800 * factor;
            if (count <= 250) return 2200 * factor;
            if (count <= 500) return 2600 * factor;
            return 3000 * factor;
        }

        function getOptimalColumns(count) {
            const orientation = document.getElementById('orientation-select').value;
            const factor = orientation === 'horizontal' ? 0.7 : 1.0;

            if (count <= 5) return Math.max(2, Math.round(3 * factor));
            if (count <= 10) return Math.max(2, Math.round(4 * factor));
            if (count <= 25) return Math.max(3, Math.round(5 * factor));
            if (count <= 50) return Math.max(4, Math.round(7 * factor));
            if (count <= 100) return Math.max(5, Math.round(10 * factor));
            if (count <= 250) return Math.max(7, Math.round(14 * factor));
            if (count <= 500) return Math.max(10, Math.round(20 * factor));
            return Math.min(24, Math.round(Math.sqrt(count * 0.75) * factor));
        }

        function setupCanvas(width, height) {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            ctx.fillStyle = "#0e141b";
            ctx.fillRect(0, 0, width, height);
        }

        async function loadAvatarImage(url) {
            if (!url) return null;
            const sources = [
                `https://wsrv.nl/?url=${encodeURIComponent(url)}&output=webp&q=85`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url
            ];

            for (let src of sources) {
                try {
                    const img = await new Promise((resolve, reject) => {
                        const i = new Image();
                        i.crossOrigin = "anonymous";
                        i.onload = () => resolve(i);
                        i.onerror = () => reject();
                        i.src = src;
                    });
                    if (img && img.naturalWidth > 0) return img;
                } catch (e) {}
            }
            return null;
        }

        function drawHeader(logicalWidth) {
            if (!userProfile) return 0;

            const padding = 35;
            const avatarSize = Math.max(80, Math.round(logicalWidth * 0.05));
            const headerHeight = avatarSize + 25;

            const avatarX = padding;
            const avatarY = padding;

            ctx.save();
            ctx.beginPath();
            ctx.arc(avatarX + avatarSize / 2, avatarY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            if (userProfile.avatarImg && userProfile.avatarImg.naturalWidth > 0) {
                ctx.drawImage(userProfile.avatarImg, avatarX, avatarY, avatarSize, avatarSize);
            } else {
                // Dibujar icono vectorial de respaldo cuando la foto no carga
                const grad = ctx.createLinearGradient(avatarX, avatarY, avatarX + avatarSize, avatarY + avatarSize);
                grad.addColorStop(0, "#2a475e");
                grad.addColorStop(1, "#101822");
                ctx.fillStyle = grad;
                ctx.fillRect(avatarX, avatarY, avatarSize, avatarSize);

                ctx.fillStyle = "#66c0f4";
                const cx = avatarX + avatarSize / 2;
                const cy = avatarY + avatarSize / 2;
                
                // Cabeza
                ctx.beginPath();
                ctx.arc(cx, cy - avatarSize * 0.1, avatarSize * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // Hombros
                ctx.beginPath();
                ctx.arc(cx, cy + avatarSize * 0.45, avatarSize * 0.35, Math.PI, 0);
                ctx.fill();
            }
            ctx.restore();

            // Anillo exterior
            ctx.save();
            ctx.beginPath();
            ctx.arc(avatarX + avatarSize / 2, avatarY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
            ctx.strokeStyle = "#66c0f4";
            ctx.lineWidth = Math.max(2, Math.round(avatarSize * 0.03));
            ctx.stroke();
            ctx.restore();

            const textX = avatarX + avatarSize + Math.round(avatarSize * 0.25);
            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${Math.max(22, Math.round(avatarSize * 0.35))}px sans-serif`;
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillText(userProfile.name, textX, avatarY + Math.round(avatarSize * 0.1));

            ctx.fillStyle = "#acb2b8";
            ctx.font = `${Math.max(13, Math.round(avatarSize * 0.18))}px sans-serif`;
            const statsText = `${userProfile.totalGames} juegos • ${userProfile.totalHours.toLocaleString()} horas en total`;
            ctx.fillText(statsText, textX, avatarY + Math.round(avatarSize * 0.55));

            ctx.strokeStyle = "#2a475e";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, avatarY + headerHeight - 5);
            ctx.lineTo(logicalWidth - padding, avatarY + headerHeight - 5);
            ctx.stroke();

            return headerHeight + 10;
        }

        function drawCard(game, x, y, w, h, rank = 0, totalCount = 25) {
            ctx.save();

            const radius = Math.min(8, w * 0.06);

            if (rank > 0 && rank <= 3 && totalCount <= 100) {
                ctx.shadowColor = 'rgba(102, 192, 244, 0.4)';
                ctx.shadowBlur = 14;
                ctx.shadowOffsetY = 3;
            } else {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetY = 2;
            }

            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, radius);
            else ctx.rect(x, y, w, h);
            ctx.fillStyle = "#1b2838";
            ctx.fill();

            ctx.save();
            ctx.clip();

            if (game.img) {
                ctx.drawImage(game.img, x, y, w, h);
            } else {
                ctx.fillStyle = "#66c0f4";
                ctx.font = `bold ${Math.max(8, w * 0.09)}px sans-serif`;
                ctx.fillText(game.name || `App ${game.appid}`, x + 4, y + h / 2);
            }

            if (w >= 45) {
                const gradHeight = Math.max(20, h * 0.35);
                const grad = ctx.createLinearGradient(x, y + h - gradHeight, x, y + h);
                grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.9)');

                ctx.fillStyle = grad;
                ctx.fillRect(x, y + h - gradHeight, w, gradHeight);

                const fontSize = Math.max(8, Math.min(12, w * 0.085));
                ctx.fillStyle = "#f3f3f3";
                ctx.font = `600 ${fontSize}px sans-serif`;
                ctx.textAlign = "right";
                ctx.textBaseline = "bottom";
                ctx.fillText(formatPlaytime(game.playtime_forever), x + w - (w * 0.05), y + h - (h * 0.04));
            }

            ctx.restore();

            ctx.strokeStyle = (rank > 0 && rank <= 3 && totalCount <= 100) ? "rgba(102, 192, 244, 0.9)" : "rgba(42, 71, 94, 0.8)";
            ctx.lineWidth = (rank > 0 && rank <= 3 && totalCount <= 100) ? 2 : 1;
            ctx.stroke();

            ctx.restore();
        }

        function renderProportional(games) {
            if (games.length === 0) return;

            const count = games.length;
            const logicalWidth = getOptimalWidth(count);
            const cols = getOptimalColumns(count);
            const aspectRatio = getAspectRatio();

            const padding = 35;
            const gap = 12;
            const headerHeight = userProfile ? Math.max(100, Math.round(logicalWidth * 0.07)) : 0;
            const maxWidth = logicalWidth - (padding * 2);

            const maxPlaytime = games[0].playtime_forever || 1;
            const minPlaytime = games[games.length - 1].playtime_forever || 1;

            const logMax = Math.log10(maxPlaytime + 1);
            const logMin = Math.log10(minPlaytime + 1);
            const logDiff = logMax - logMin || 1;

            let maxCardWidth = (maxWidth / cols) * 1.25;

            let x = padding;
            let y = padding + headerHeight;
            let rowMaxHeight = 0;
            const itemsToDraw = [];

            games.forEach((game, index) => {
                const currentLog = Math.log10((game.playtime_forever || 1) + 1);
                const normalizedRatio = (currentLog - logMin) / logDiff;
                const scaleFactor = 0.55 + (0.45 * normalizedRatio);

                let w = Math.max(50, Math.min(maxWidth, maxCardWidth * scaleFactor));
                let h = w * aspectRatio;

                if (x + w > logicalWidth - padding + 2) {
                    x = padding;
                    y += rowMaxHeight + gap;
                    rowMaxHeight = 0;
                }

                itemsToDraw.push({ game, x, y, w, h, rank: index + 1 });

                x += w + gap;
                if (h > rowMaxHeight) rowMaxHeight = h;
            });

            setupCanvas(logicalWidth, y + rowMaxHeight + padding);
            drawHeader(logicalWidth);

            itemsToDraw.forEach(item => {
                drawCard(item.game, item.x, item.y, item.w, item.h, item.rank, count);
            });
        }

        function renderGrid(games) {
            if (games.length === 0) return;

            const count = games.length;
            const logicalWidth = getOptimalWidth(count);
            const cols = getOptimalColumns(count);
            const aspectRatio = getAspectRatio();

            const padding = 35;
            const gap = 12;
            const headerHeight = userProfile ? Math.max(100, Math.round(logicalWidth * 0.07)) : 0;

            const itemWidth = (logicalWidth - (padding * 2) - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * aspectRatio;

            const rows = Math.ceil(games.length / cols);

            setupCanvas(logicalWidth, headerHeight + (padding * 2) + (rows * (itemHeight + gap)) - gap);
            drawHeader(logicalWidth);

            games.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + col * (itemWidth + gap);
                const y = padding + headerHeight + row * (itemHeight + gap);

                drawCard(game, x, y, itemWidth, itemHeight, index + 1, count);
            });
        }

        function renderHero(games) {
            if (games.length === 0) return;

            const count = games.length;
            const logicalWidth = getOptimalWidth(count);
            const aspectRatio = getAspectRatio();

            const padding = 35;
            const gap = 12;
            const headerHeight = userProfile ? Math.max(100, Math.round(logicalWidth * 0.07)) : 0;

            const topGame = games[0];
            const heroWidth = Math.min(450, (logicalWidth - (padding * 2) - gap) * 0.4);
            const heroHeight = heroWidth * aspectRatio;

            const subGames = games.slice(1);

            if (subGames.length === 0) {
                setupCanvas(logicalWidth, headerHeight + (padding * 2) + heroHeight);
                drawHeader(logicalWidth);
                drawCard(topGame, padding, padding + headerHeight, heroWidth, heroHeight, 1, count);
                return;
            }

            const subAreaWidth = logicalWidth - padding - (padding + heroWidth + gap);
            const cols = Math.max(2, getOptimalColumns(subGames.length) - 2);

            const startY = padding + headerHeight;
            const itemWidth = (subAreaWidth - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * aspectRatio;

            const rows = Math.ceil(subGames.length / cols);
            const subAreaHeight = (rows * (itemHeight + gap)) - gap;

            setupCanvas(logicalWidth, headerHeight + Math.max(heroHeight, subAreaHeight) + (padding * 2));
            drawHeader(logicalWidth);

            drawCard(topGame, padding, padding + headerHeight, heroWidth, heroHeight, 1, count);

            subGames.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = (padding + heroWidth + gap) + col * (itemWidth + gap);
                const y = startY + row * (itemHeight + gap);

                drawCard(game, x, y, itemWidth, itemHeight, index + 2, count);
            });
        }

        async function processAndRender() {
            if (rawUserGames.length === 0) return;

            const limitVal = document.getElementById('limit-select').value;
            let filtered = rawUserGames;

            if (limitVal !== 'all') {
                const limitNum = parseInt(limitVal, 10);
                filtered = rawUserGames.slice(0, limitNum);
            }

            loadedGames = await loadGameImages(filtered);
            
            const style = document.getElementById('style-select').value;
            statusEl.textContent = "Renderizando póster...";

            setTimeout(() => {
                if (style === 'proportional') renderProportional(loadedGames);
                else if (style === 'grid') renderGrid(loadedGames);
                else if (style === 'hero') renderHero(loadedGames);
                statusEl.innerHTML = `¡Mural listo (${loadedGames.length} juegos)!`;
            }, 30);
        }

        document.getElementById('orientation-select').addEventListener('change', processAndRender);
        document.getElementById('style-select').addEventListener('change', processAndRender);
        document.getElementById('limit-select').addEventListener('change', processAndRender);

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            const userInput = document.getElementById('steam-input').value.trim();

            if (!userInput) {
                alert("Por favor ingresa la URL o usuario de Steam.");
                return;
            }

            statusEl.textContent = "Consultando datos del usuario y juegos...";

            try {
                const response = await fetch(`${WORKER_URL}?user=${encodeURIComponent(userInput)}`);
                const data = await response.json();

                if (data.error) {
                    statusEl.textContent = `Error: ${data.error}`;
                    return;
                }

                if (data.response && data.response.games) {
                    rawUserGames = data.response.games
                        .filter(g => g.playtime_forever > 0)
                        .sort((a, b) => b.playtime_forever - a.playtime_forever);

                    if (rawUserGames.length === 0) {
                        statusEl.textContent = "No se encontraron juegos jugados en esta cuenta.";
                        return;
                    }

                    statusEl.textContent = "Obteniendo datos del perfil...";
                    const profileInfo = await getSteamProfileInfo(userInput, data);
                    const avatarImg = await loadAvatarImage(profileInfo.avatarUrl);

                    const totalMinutes = rawUserGames.reduce((sum, g) => sum + (g.playtime_forever || 0), 0);

                    userProfile = {
                        name: profileInfo.name,
                        avatarImg: avatarImg,
                        totalGames: rawUserGames.length,
                        totalHours: Math.round(totalMinutes / 60)
                    };

                    await processAndRender();
                } else {
                    statusEl.textContent = "El perfil o la lista de juegos son PRIVADOS.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error al conectar con el proxy.";
            }
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `steam-poster-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
