<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Library Poster Showcase</title>
    <style>
        :root {
            --bg-color: #0e141b;
            --panel-bg: #1b2838;
            --accent-color: #66c0f4;
            --text-color: #f3f3f3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #acb2b8;
        }

        input, select, button {
            background: #101822;
            border: 1px solid #2a475e;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 5px;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .btn-secondary { background: #2a475e; }

        .notice-box {
            background-color: rgba(102, 192, 244, 0.08);
            border: 1px solid #2a475e;
            border-left: 3px solid var(--accent-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #acb2b8;
            line-height: 1.4;
        }

        .notice-box strong { color: var(--accent-color); }

        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #05080c;
        }

        canvas {
            max-width: 95%;
            max-height: 95%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            background: #0e141b;
        }

        #status {
            font-size: 0.8rem;
            color: #66c0f4;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Steam Library Poster</h1>
        
        <div class="control-group">
            <label for="style-select">Diseño del Mural:</label>
            <select id="style-select">
                <option value="hero">Top 1 Destacado + Galería</option>
                <option value="grid">Mural de Colección (Grid)</option>
                <option value="proportional">Mosaico Simétrico por Horas</option>
            </select>
        </div>

        <hr style="border: 0.5px solid #2a475e; width: 100%;">

        <div class="notice-box">
            <strong>Requisito de Privacidad:</strong> El perfil de Steam y la opción <em>"Detalles de los juegos"</em> deben estar configurados como <strong>Públicos</strong>.
        </div>

        <div class="control-group">
            <label for="steam-input">Perfil o URL de Steam:</label>
            <input type="text" id="steam-input" placeholder="Ej: https://steamcommunity.com/id/usuario">
        </div>

        <button id="btn-fetch">Generar Póster</button>
        <button id="btn-download" class="btn-secondary">Descargar Póster (PNG)</button>

        <div id="status">Ingresa un perfil para comenzar.</div>
    </div>

    <div id="canvas-container">
        <canvas id="art-canvas" width="1200" height="1200"></canvas>
    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU CLOUDFLARE WORKER
        const WORKER_URL = "https://steamproxy.ernestoygabo.workers.dev/";

        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let loadedGames = [];

        function getCorsImageUrl(appid) {
            const rawUrl = `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/header.jpg`;
            return `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}&output=jpg`;
        }

        async function loadGameImages(games) {
            statusEl.textContent = "Cargando portadas de juegos...";
            
            const imagePromises = games.map((game) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";

                    img.onload = () => resolve({ ...game, img });
                    img.onerror = () => resolve({ ...game, img: null });
                    
                    img.src = getCorsImageUrl(game.appid);
                });
            });

            return Promise.all(imagePromises);
        }

        function drawCard(game, x, y, w, h) {
            if (game.img) {
                ctx.drawImage(game.img, x, y, w, h);
            } else {
                ctx.fillStyle = "#1b2838";
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = "#66c0f4";
                ctx.font = "bold 13px Segoe UI, sans-serif";
                ctx.fillText(game.name || `App ${game.appid}`, x + 10, y + h / 2);
            }
            ctx.strokeStyle = "#2a475e";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
        }

        function renderGrid(games) {
            ctx.fillStyle = "#0e141b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cols = 4;
            const padding = 40;
            const gap = 20;

            const itemWidth = (canvas.width - (padding * 2) - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * 0.46;

            games.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + col * (itemWidth + gap);
                const y = padding + row * (itemHeight + gap);

                if (y + itemHeight > canvas.height - padding) return;
                drawCard(game, x, y, itemWidth, itemHeight);
            });
        }

        function renderHero(games) {
            ctx.fillStyle = "#0a0f14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (games.length === 0) return;

            const padding = 40;
            const gap = 15;

            const topGame = games[0];
            const heroWidth = canvas.width - (padding * 2);
            const heroHeight = heroWidth * 0.45;

            drawCard(topGame, padding, padding, heroWidth, heroHeight);

            const subGames = games.slice(1);
            const cols = 4;
            const startY = padding + heroHeight + 30;

            const itemWidth = (canvas.width - (padding * 2) - (gap * (cols - 1))) / cols;
            const itemHeight = itemWidth * 0.46;

            subGames.forEach((game, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + col * (itemWidth + gap);
                const y = startY + row * (itemHeight + gap);

                if (y + itemHeight > canvas.height - padding) return;
                drawCard(game, x, y, itemWidth, itemHeight);
            });
        }

        function renderProportional(games) {
            ctx.fillStyle = "#0e141b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const total = games.reduce((acc, g) => acc + (g.playtime_forever || 10), 0);
            let x = 30, y = 30;
            const maxWidth = canvas.width - 60;

            games.forEach((game) => {
                const ratio = (game.playtime_forever || 10) / total;
                const w = Math.max(140, Math.min(maxWidth, Math.sqrt(maxWidth * canvas.height * ratio * 1.5)));
                const h = w * 0.46;

                if (x + w > canvas.width - 30) {
                    x = 30;
                    y += h + 15;
                }

                if (y + h > canvas.height - 30) return;

                drawCard(game, x, y, w, h);
                x += w + 15;
            });
        }

        function generateArt() {
            if (loadedGames.length === 0) return;

            const style = document.getElementById('style-select').value;
            statusEl.textContent = "Dibujando póster...";

            setTimeout(() => {
                if (style === 'grid') renderGrid(loadedGames);
                else if (style === 'hero') renderHero(loadedGames);
                else if (style === 'proportional') renderProportional(loadedGames);
                statusEl.textContent = "¡Póster renderizado con éxito!";
            }, 50);
        }

        document.getElementById('style-select').addEventListener('change', generateArt);

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            const userInput = document.getElementById('steam-input').value.trim();

            if (!userInput) {
                alert("Por favor ingresa la URL o usuario de Steam.");
                return;
            }

            statusEl.textContent = "Consultando perfil a través del servidor seguro...";

            try {
                const response = await fetch(`${WORKER_URL}?user=${encodeURIComponent(userInput)}`);
                const data = await response.json();

                if (data.error) {
                    statusEl.textContent = `Error: ${data.error}`;
                    return;
                }

                if (data.response && data.response.games) {
                    const userGames = data.response.games.sort((a, b) => b.playtime_forever - a.playtime_forever);
                    loadedGames = await loadGameImages(userGames.slice(0, 24));
                    generateArt();
                } else {
                    statusEl.textContent = "El perfil o la lista de juegos son PRIVADOS.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error al conectar con el servidor proxy.";
            }
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'steam-library-poster.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
